<style>
:root{
  --ink:#05060c;
  --ice:#2E9BFF;
  --azure:#1E6BFF;
  --violet:#7C3AED;
  --grape:#6B3FE6;
  --mag:#A78BFA;
  --gold:#FBBF24;
}
* { -webkit-tap-highlight-color: transparent; }
body { font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; touch-action: manipulation; }
.font-display { font-family:'Anton',sans-serif; letter-spacing:.02em; font-weight:400; }

/* ── COPY PROTECTION ─────────────────────────────────────────── */
.no-select {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.no-context { pointer-events: none; }
/* ─────────────────────────────────────────────────────────────── */

@keyframes pulse-neon {
  0%, 100% { text-shadow: 0 0 10px var(--ice), 0 0 20px var(--azure); }
  50% { text-shadow: 0 0 20px var(--ice), 0 0 40px var(--ice), 0 0 60px var(--azure); }
}
@keyframes slide-up {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes spin-slow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes points-fly {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
}
.neon-text { animation: pulse-neon 2s ease-in-out infinite; }
.slide-up { animation: slide-up 0.6s ease-out forwards; }
.spinner { animation: spin-slow 1s linear infinite; }
.points-fly { animation: points-fly 1s ease-out forwards; }
.logo-glow { box-shadow: 0 0 50px rgba(46,155,255,0.45), 0 0 90px rgba(124,58,237,0.25); }
</style>

function getPlayerId() {
  try {
    let id = localStorage.getItem('bs_player_id');
    if (!id) {
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('p_' + Date.now() + '_' + Math.random().toString(36).slice(2));
      localStorage.setItem('bs_player_id', id);
    }
    return id;
  } catch(e) {
    return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  }
}

async function getLeaderboard(categoryId) {
  try {
    const filter = categoryId ? `&category=eq.${encodeURIComponent(categoryId)}` : '';
    const res = await fetch(`${SUPABASE_URL}/rest/v1/Leaderboard?order=total_points.desc&limit=10${filter}`, { headers: HEADERS });
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  } catch(e) { return []; }
}

async function saveScore(entry) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/Leaderboard?on_conflict=player_id,category`, {
      method: 'POST',
      headers: { ...HEADERS, 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(entry)
    });
  } catch(e) { console.error('Save error', e); }
}

const HOST_CODE = 'backspin';
const HOST_TIME = 30;
// Bucketed speed scoring: answer in the first 10s = 1000, next 10s = 750, last 10s = 500.
// Because this is keyed off timeLeft at the moment you lock in, and time only moves
// forward, a later tap can only land in the same bucket or a lower one — never higher.
function bucketPoints(timeLeft) {
  if (timeLeft > 20) return 1000;
  if (timeLeft > 10) return 750;
  return 500;
}
function buildEventPlaylist() {
  // 2006 Reunion: Round 1 = ids 1-10, Round 2 = ids 11-20, Round 3 = ids 21-30.
  // Questions shuffle inside their own round, so each round keeps its genre mix and difficulty.
  const ranges = [[1,10],[11,20],[21,30]];
  let pl = [];
  ranges.forEach(([lo, hi]) => {
    const ids = triviaQuestions.filter(q => q.id >= lo && q.id <= hi).map(q => q.id);
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    pl = pl.concat(ids.slice(0, ROUND_SIZE));
  });
  return pl;
}

async function gsRead() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/game_state?id=eq.1&select=*`, { headers: HEADERS });
    const d = await r.json();
    return Array.isArray(d) ? d[0] : null;
  } catch(e) { console.error('gs read', e); return null; }
}

async function gsWrite(patch) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/game_state?id=eq.1`, {
      method: 'PATCH',
      headers: { ...HEADERS, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ ...patch, updated_at: new Date().toISOString() })
    });
  } catch(e) { console.error('gs write', e); }
}

    });
  } catch(e) { console.error('join', e); }
}

async function bankEventScore({ name, total_points, correct_count, total_questions }) {
  const entry = { player_id: getPlayerId(), name: name || 'Player', total_points: total_points || 0, correct_count: correct_count || 0, total_questions: total_questions || 0, category: 'event', updated_at: new Date().toISOString() };
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/Leaderboard?on_conflict=player_id,category`, {
      method: 'POST', headers: { ...HEADERS, 'Prefer': 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(entry)
    });
  } catch(e) { console.error('bank', e); }
}

function MusicTrivia() {
  const [gameState, setGameState] = useState('landing');
  const [playerName, setPlayerName] = useState('');
  const [selectedCategory, setSelectedCategory] = useState(null);
  const [currentQ, setCurrentQ] = useState(0);
  const [roundStarts, setRoundStarts] = useState([0]);
  const [totalPoints, setTotalPoints] = useState(0);
  const [correctCount, setCorrectCount] = useState(0);
  const [selected, setSelected] = useState(null);
  const [showAnswer, setShowAnswer] = useState(false);
  const [timer, setTimer] = useState(MAX_TIME);
  const [questions, setQuestions] = useState([]);
  const [leaderboard, setLeaderboard] = useState([]);
  const [boardLoading, setBoardLoading] = useState(true);
  const [savingScore, setSavingScore] = useState(false);
  const [lastPts, setLastPts] = useState(null);
  const [showPtsPop, setShowPtsPop] = useState(false);
  const [activeLandingTab, setActiveLandingTab] = useState('all');
  const [tabBoards, setTabBoards] = useState({});
  const [tabLoading, setTabLoading] = useState({});
  const timerRef = useRef(MAX_TIME);
  const pointsRef = useRef(0);
  const correctRef = useRef(0);

  const refreshBoard = useCallback(async (catId) => {
    setBoardLoading(true);
    const data = await getLeaderboard(catId);
    setLeaderboard(Array.isArray(data) ? data : []);
    setBoardLoading(false);
  }, []);

  const loadTab = useCallback(async (catId) => {
    if (tabBoards[catId]) return;
    setTabLoading(prev => ({ ...prev, [catId]: true }));
    const data = await getLeaderboard(catId === 'all' ? null : catId);
    setTabBoards(prev => ({ ...prev, [catId]: Array.isArray(data) ? data : [] }));
    setTabLoading(prev => ({ ...prev, [catId]: false }));
  }, [tabBoards]);

  useEffect(() => { loadTab('all'); }, []);

  useEffect(() => {
    if (gameState !== 'playing' || showAnswer) return;
    if (timer <= 0) {
      setShowAnswer(true); setLastPts(0); setShowPtsPop(true);
      setTimeout(() => setShowPtsPop(false), 900);
      return;
    }
    const id = setInterval(() => setTimer(t => { timerRef.current = t - 1; return t - 1; }), 1000);
    return () => clearInterval(id);
  }, [timer, showAnswer, gameState]);

  const handleAnswer = (idx) => {
    if (showAnswer || selected !== null) return;
    const tl = timerRef.current;
    setSelected(idx);
    setShowAnswer(true);
    const correct = idx === questions[currentQ].correctIndex;
    const pts = correct ? calcPoints(tl) : 0;
    if (correct) {
      pointsRef.current += pts;
      correctRef.current += 1;
      setTotalPoints(pointsRef.current);
      setCorrectCount(correctRef.current);
    }
    setLastPts(pts);
    setShowPtsPop(true);
    setTimeout(() => setShowPtsPop(false), 950);
  };

  const nextQ = async () => {
    if (currentQ < questions.length - 1) {
      const nextIndex = currentQ + 1;
      setCurrentQ(nextIndex); setSelected(null); setShowAnswer(false);
      setTimer(MAX_TIME); timerRef.current = MAX_TIME; setShowPtsPop(false);
      if (roundStarts.includes(nextIndex)) setGameState('roundbreak');
    } else {
      setSavingScore(true);
      await saveScore({
        player_id: getPlayerId(),
        name: playerName || 'Anonymous',
        total_points: pointsRef.current,
        correct_count: correctRef.current,
        total_questions: questions.length,
        category: selectedCategory,
        updated_at: new Date().toISOString()
      });
      await refreshBoard(selectedCategory);
      setSavingScore(false);
      setGameState('finished');
    }
  };

  const startGame = () => {
    const cat = categories.find(c => c.id === selectedCategory);
    let pool = cat.years ? triviaQuestions.filter(q => cat.years.includes(q.year)) : triviaQuestions;
    if (!pool.length) pool = triviaQuestions;
    const qs = [...pool].sort(() => Math.random() - 0.5).map(q => {
      const opts = [...q.options].sort(() => Math.random() - 0.5);
      return { ...q, options: opts, correctIndex: opts.indexOf(q.answer) };
    });
    const N = qs.length, base = Math.floor(N / 3), rem = N % 3;
    const s1 = base + (rem > 0 ? 1 : 0), s2 = base + (rem > 1 ? 1 : 0);
    setRoundStarts([0, s1, s1 + s2]);
    setQuestions(qs); setGameState('playing');
    setCurrentQ(0); setTotalPoints(0); setCorrectCount(0);
    pointsRef.current = 0; correctRef.current = 0;
    setSelected(null); setShowAnswer(false);
    setTimer(MAX_TIME); timerRef.current = MAX_TIME;
  };

  const btnClass = (idx) => {
    const base = 'w-full p-4 rounded-xl font-bold text-lg transition-all duration-300 border-2 text-left no-select';

    if (idx === questions[currentQ].correctIndex) return `${base} bg-green-600 border-green-400 text-white`;

  const medal = (i) => ['🥇','🥈','🥉'][i] || `#${i+1}`;

            </div>

            <p className="text-gray-500 text-xs text-center mt-3 no-select">Wrong answer or timeout = 0 pts</p>
          </div>
          <div className="bg-black/40 backdrop-blur-sm rounded-3xl p-8 border-2 border-violet-400/30 text-center">
            <h2 className="text-2xl font-bold text-white mb-4 no-select">📱 Scan to Play</h2>
            <div className="bg-white p-4 rounded-2xl inline-block" style={{boxShadow:'0 0 40px rgba(46,155,255,0.4)'}}>
              <img src={qr} alt="Scan to play" className="w-48 h-48" loading="lazy" />
            </div>
            <p className="text-[var(--ice)] text-sm uppercase tracking-wider mt-3 no-select">{GAME_HOST}</p>
          </div>
          <div className="bg-black/40 backdrop-blur-sm rounded-3xl p-8 border-2 border-blue-400/30">
            <h2 className="text-2xl font-bold text-white mb-6 no-select">Enter Your Name</h2>
            <input type="text" value={playerName} onChange={e => setPlayerName(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && playerName.trim() && setGameState('category')}
              onPaste={e => e.preventDefault()}
              placeholder="Your name..." maxLength={20}
              className="w-full px-6 py-4 rounded-xl bg-gray-800 border-2 border-blue-500 text-white text-xl focus:outline-none focus:border-[var(--mag)] mb-4" />
            <button onClick={() => { if (playerName.trim()) setGameState('category'); }} disabled={!playerName.trim()}
              className="w-full bg-gradient-to-r from-[var(--ice)] to-[var(--violet)] text-white font-black text-2xl py-5 rounded-xl hover:scale-105 transition shadow-2xl disabled:opacity-50 disabled:cursor-not-allowed no-select">
              START PLAYING 🎧
            </button>
          </div>
          <LandingBoard />
        </div>
      </div>
    );
  }

  // ── CATEGORY ──────────────────────────────────────────────────────────────
  if (gameState === 'category') return (
    <div className="min-h-screen bg-gradient-to-br from-[#0a0b16] via-black to-[#10122a] p-6">
      <div className="max-w-2xl mx-auto">
        <div className="text-center mb-8 mt-6">
          <BrandMark size="h-8" />
          <h1 className="font-display text-5xl mt-6 mb-2 no-select" style={{background:'linear-gradient(90deg,#5BC0FF,#8B5CF6)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>HEY {playerName}!</h1>
          <p className="text-[var(--ice)] text-xl neon-text uppercase tracking-widest no-select">Select An Era</p>
        </div>
        <div className="grid grid-cols-2 gap-4 mb-6">
          {categories.map(cat => (
            <button key={cat.id} onClick={() => { setSelectedCategory(cat.id); setGameState('start'); }}
              className={`bg-gradient-to-br ${cat.color} p-6 rounded-2xl border-2 border-blue-400/30 hover:border-[var(--mag)] hover:scale-105 transition-all duration-300 shadow-lg no-select flex flex-col items-center`}>
              <div className="mb-3"><CategoryArt art={cat.art} /></div>
              <div className="text-white font-black text-lg tracking-wider">{cat.name}</div>
            </button>
          ))}
        </div>
        <button onClick={() => { setGameState('landing'); setPlayerName(''); }} className="w-full bg-gray-800 text-white font-bold py-3 rounded-xl hover:bg-gray-700 transition no-select">Back to Home</button>
      </div>
    </div>
  );

  // ── START ─────────────────────────────────────────────────────────────────
  if (gameState === 'start') {
    const cat = categories.find(c => c.id === selectedCategory);
    return (
      <div className={`min-h-screen bg-gradient-to-br ${cat.color} flex items-center justify-center p-4`}>
        <div className="max-w-md w-full text-center space-y-6">
          <div className="inline-block bg-black/25 rounded-3xl p-6"><CategoryArt art={cat.art} /></div>
          <h1 className="font-display text-5xl text-white no-select">{cat.name}</h1>
          <div className="bg-black/30 backdrop-blur-sm rounded-2xl p-6 space-y-2">
            <div className="text-white text-lg no-select">{triviaQuestions.filter(qq => cat.years.includes(qq.year)).length} Questions · 3 Rounds</div>
            <div className="text-white text-lg no-select">20 Seconds Each</div>
            <div className="text-[var(--gold)] text-sm mt-2 no-select">Faster = More Points!</div>
          </div>
          <button onClick={startGame} className="w-full bg-gradient-to-r from-[var(--gold)] to-orange-500 text-black font-black text-xl py-4 rounded-full hover:scale-105 transition shadow-2xl no-select">DROP THE NEEDLE</button>
          <button onClick={() => { setGameState('category'); setSelectedCategory(null); }} className="w-full bg-black/30 text-white font-bold text-lg py-3 rounded-full hover:bg-black/40 transition no-select">Back to Eras</button>
        </div>
      </div>
    );
  }

  // ── FINISHED ──────────────────────────────────────────────────────────────
  if (gameState === 'finished') {
    const myId = getPlayerId();
    const rank = (leaderboard.findIndex(e => e.player_id === myId) + 1) || (leaderboard.findIndex(e => e.name === playerName && e.total_points === totalPoints) + 1);
    const pct = Math.round((correctCount / questions.length) * 100);
    const tier = pct>=80?"🎧 HEADLINER!":pct>=60?"ON THE ONES & TWOS!":pct>=40?"WARMING UP THE CROWD":"SOUND CHECK";
    return (
      <div className="min-h-screen bg-gradient-to-br from-[#0a0b16] via-[#15103a] to-black p-4 overflow-y-auto">
        <div className="max-w-2xl mx-auto py-6 space-y-6">
          <div className="text-center space-y-4">
            <BrandMark size="h-8" />
            <div className="text-8xl no-select pt-2">🏆</div>
            <h1 className="font-display text-5xl text-white no-select">THAT'S A WRAP!</h1>
            <div className="bg-black/30 backdrop-blur-sm rounded-2xl p-8 space-y-3">
              <div className="text-2xl text-gray-300 no-select">Hey {playerName}!</div>
              <div className="text-6xl font-black text-[var(--gold)] no-select">{totalPoints.toLocaleString()}</div>
              <div className="text-xl text-[var(--ice)] font-bold uppercase tracking-wider no-select">Points</div>
              <div className="text-lg text-white no-select">{correctCount}/{questions.length} correct · {pct}%</div>
              {rank > 0 && rank <= 10 && <div className="text-xl text-green-400 no-select">You are #{rank} in this category!</div>}
              <div className="text-2xl text-[var(--mag)] font-display no-select">{tier}</div>
            </div>
          </div>
          {savingScore ? (
            <div className="text-center py-4"><div className="text-3xl spinner inline-block">💾</div><p className="text-[var(--ice)] mt-2">Saving score...</p></div>
          ) : <PostGameBoard hName={playerName} hPts={totalPoints} />}
          <button onClick={startGame} className="w-full bg-gradient-to-r from-[var(--ice)] to-[var(--violet)] text-white font-black text-xl py-4 rounded-full hover:scale-105 transition shadow-2xl no-select">PLAY AGAIN</button>
          <button onClick={() => { setGameState('category'); setSelectedCategory(null); }} className="w-full bg-gray-700 text-white font-bold text-lg py-3 rounded-full hover:bg-gray-600 transition no-select">Choose Different Era</button>
          <button onClick={() => { setGameState('landing'); setPlayerName(''); setSelectedCategory(null); }} className="w-full bg-gray-800 text-white font-bold py-3 rounded-full hover:bg-gray-700 transition no-select">Back to Home</button>
        </div>
      </div>
    );
  }

  // ── ROUND BREAK ───────────────────────────────────────────────────────────
  if (gameState === 'roundbreak') {
    const cat = categories.find(c => c.id === selectedCategory);
    const totalRounds = roundStarts.length;
    const nextRound = roundStarts.filter(s => s <= currentQ).length;
    return (
      <div className={`min-h-screen bg-gradient-to-br ${cat ? cat.color : 'from-[#0a0b16] to-black'} flex items-center justify-center p-4`}>
        <div className="max-w-md w-full text-center space-y-6">
          <BrandMark size="h-8" />
          <h1 className="font-display text-5xl text-white no-select">ROUND {nextRound - 1} DONE!</h1>
          <div className="bg-black/30 backdrop-blur-sm rounded-2xl p-6 space-y-3">
            <div className="text-gray-200 text-lg no-select">Score so far</div>
            <div className="text-5xl font-black text-[var(--gold)] no-select">{totalPoints.toLocaleString()}</div>
            <div className="text-white no-select">{correctCount} correct</div>
            <div className="text-[var(--ice)] text-sm mt-2 no-select">Next up · Round {nextRound} of {totalRounds}</div>
          </div>
          <button onClick={() => setGameState('playing')} className="w-full bg-gradient-to-r from-[var(--gold)] to-orange-500 text-black font-black text-xl py-4 rounded-full hover:scale-105 transition shadow-2xl no-select">START ROUND {nextRound}</button>
        </div>
      </div>
    );
  }

  // ── PLAYING ───────────────────────────────────────────────────────────────
  const q = questions[currentQ];
  const potential = calcPoints(timer);

  return (
    <div className="min-h-screen bg-gradient-to-br from-[#0a0b16] via-[#15103a] to-black p-4">
      <div className="max-w-2xl mx-auto py-4 space-y-4">
        <div className="pb-1"><BrandMark size="h-7" /></div>
        <div className="text-center text-sm font-bold text-[var(--mag)] uppercase tracking-widest no-select">Round {roundStarts.filter(s => s <= currentQ).length} of {roundStarts.length}</div>
        <div className="flex justify-between items-center gap-2">
          <div className="bg-black/40 backdrop-blur-sm px-4 py-2 rounded-xl text-center flex-1">
            <div className="text-xs text-gray-400 no-select">QUESTION</div>
            <div className="text-lg font-bold text-white no-select">{currentQ+1}/{questions.length}</div>
          </div>
          <div className="bg-black/40 backdrop-blur-sm px-4 py-2 rounded-xl text-center flex-1">
            <div className="text-xs text-gray-400 no-select">SCORE</div>
            <div className="text-lg font-black text-[var(--gold)] no-select">{totalPoints.toLocaleString()}</div>
          </div>
          <div className="bg-black/40 backdrop-blur-sm px-4 py-2 rounded-xl text-center flex-1">
            <div className="text-xs text-gray-400 no-select">CORRECT</div>
            <div className="text-lg font-black text-green-400 no-select">{correctCount}</div>
          </div>
        </div>
        <div className="bg-black/40 backdrop-blur-sm rounded-xl p-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-white font-bold no-select">Time Left</span>
            <div className="flex items-center gap-3">
              {!showAnswer && <span className="text-sm font-bold text-[var(--gold)] no-select">+{potential.toLocaleString()} pts</span>}
              <span className={`text-2xl font-black no-select ${timer<=5?'text-red-400 animate-pulse':timer<=10?'text-orange-400':'text-[var(--gold)]'}`}>{timer}s</span>
            </div>
          </div>
          <div className="h-4 bg-gray-700 rounded-full overflow-hidden">
            <div className={`h-full transition-all duration-1000 rounded-full ${timer<=5?'bg-red-500':timer<=10?'bg-orange-400':'bg-[var(--ice)]'}`} style={{width:`${(timer/MAX_TIME)*100}%`}}/>
          </div>
        </div>

        {/* QUESTION — fully copy protected */}
        <div className="bg-black/50 backdrop-blur-sm rounded-2xl p-6 shadow-2xl relative overflow-hidden"
          onCopy={e => e.preventDefault()}
          onCut={e => e.preventDefault()}>
          <div className="text-xs text-[var(--ice)] uppercase tracking-wider mb-2 no-select">{q.year} · {q.genre}</div>
          <h2 className="text-2xl md:text-3xl font-black text-white text-center leading-tight no-select"
            onCopy={e => e.preventDefault()}
            onCut={e => e.preventDefault()}>
            {q.question}
          </h2>
          {showPtsPop && (
            <div className={`absolute top-3 right-4 text-2xl font-black points-fly no-select ${lastPts>0?'text-[var(--gold)]':'text-red-400'}`}>
              {lastPts>0?`+${lastPts.toLocaleString()}`:'MISS!'}
            </div>
          )}
        </div>

        {/* ANSWER BUTTONS — no-select + copy blocked */}
        <div className="space-y-3">
          {q.options.map((opt, i) => (
            <button key={i} onClick={() => handleAnswer(i)} disabled={showAnswer}
              onCopy={e => e.preventDefault()}
              className={btnClass(i)}>
              <span className="mr-2 opacity-60 text-sm">{String.fromCharCode(65+i)}.</span>{opt}
            </button>
          ))}
        </div>

        {showAnswer && (
          <button onClick={nextQ} className="w-full bg-gradient-to-r from-[var(--ice)] to-[var(--violet)] text-white font-black text-xl py-4 rounded-full hover:scale-105 transition shadow-2xl no-select">
            {currentQ < questions.length-1 ? 'NEXT QUESTION' : 'SEE RESULTS'}
          </button>
        )}
      </div>
    </div>
  );
}

function HostGate({ onPass }) {
  const [code, setCode] = useState('');
  const tryPass = () => { if (code === HOST_CODE) onPass(); };
  return (
    <div className="min-h-screen bg-gradient-to-br from-[#0a0b16] via-[#15103a] to-black flex items-center justify-center p-4">
      <div className="max-w-sm w-full bg-black/40 rounded-2xl p-6 space-y-4 text-center">
        <BrandMark size="h-8" />
        <div className="text-white font-bold text-lg no-select">Host access</div>
        <input value={code} onChange={e => setCode(e.target.value)} type="password" placeholder="Host code"
          onKeyDown={e => e.key === 'Enter' && tryPass()}
          className="w-full px-4 py-3 rounded-xl bg-gray-900 text-white border border-gray-700 focus:outline-none" />
        <button onClick={tryPass} className="w-full bg-gradient-to-r from-[var(--gold)] to-orange-500 text-black font-black py-3 rounded-full no-select">Enter</button>
      </div>
    </div>
  );
}

function HostView() {
  const [authed, setAuthed] = useState(false);
  if (!authed) return <HostGate onPass={() => setAuthed(true)} />;
  return <HostControls />;
}

function HostControls() {
  const [gs, setGs] = useState(null);
  const [players, setPlayers] = useState([]);
  const [busy, setBusy] = useState(false);
  const [nowTick, setNowTick] = useState(Date.now());
  const [autoPlay, setAutoPlay] = useState(true);
  const autoRevealedFor = useRef(null);
  const autoNextTimer = useRef(null);
  const load = useCallback(async () => { setGs(await gsRead()); setPlayers(await getEventPlayers()); }, []);
  useEffect(() => { load(); const id = setInterval(load, 2000); return () => clearInterval(id); }, [load]);
  useEffect(() => { const id = setInterval(() => setNowTick(Date.now()), 250); return () => clearInterval(id); }, []);
  const patch = async (p) => { setBusy(true); await gsWrite(p); await load(); setBusy(false); };
  const now = () => new Date().toISOString();
  const phase = gs?.phase || 'idle';
  const qIndex = gs?.q_index ?? 0;
  const playlist = gs?.playlist || [];
  const question = (playlist.length && qIndex < playlist.length) ? triviaQuestions.find(q => q.id === playlist[qIndex]) : null;
  const roundNum = Math.floor(qIndex / ROUND_SIZE) + 1;
  const qInRound = (qIndex % ROUND_SIZE) + 1;
  const startedAt = gs?.question_started_at ? new Date(gs.question_started_at).getTime() : null;
  const timeLeft = (phase === 'playing' && startedAt) ? Math.max(0, Math.ceil(HOST_TIME - (nowTick - startedAt) / 1000)) : null;
  const startEvent = () => patch({ playlist: buildEventPlaylist(), phase: 'playing', round: 1, q_index: 0, question_started_at: now() });
  const reveal = () => patch({ phase: 'reveal' });
  const nextQ = () => {
    const next = qIndex + 1;
    if (next >= 3 * ROUND_SIZE) { patch({ phase: 'finished' }); return; }
    if (next % ROUND_SIZE === 0) { patch({ phase: 'roundbreak', round: Math.floor(next / ROUND_SIZE) + 1, q_index: next }); }
    else { patch({ phase: 'playing', q_index: next, question_started_at: now() }); }
  };
  const startNextRound = () => patch({ phase: 'playing', question_started_at: now() });

  // Auto-play: when the clock hits 0, auto-reveal; after a pause, auto-advance to the next question.
  // Round breaks always stay manual — the host chooses when to start the next round.
  useEffect(() => {
    if (!autoPlay) return;
    if (phase === 'playing' && timeLeft === 0 && question && autoRevealedFor.current !== qIndex) {
      autoRevealedFor.current = qIndex;
      reveal();
    }
  }, [autoPlay, phase, timeLeft, qIndex, question]);

  useEffect(() => {
    if (!autoPlay || phase !== 'reveal' || !question) return;
    autoNextTimer.current = setTimeout(() => { nextQ(); }, 7000);
    return () => { if (autoNextTimer.current) clearTimeout(autoNextTimer.current); };
  }, [autoPlay, phase, qIndex, question]);

  let inner;
  if ((phase === 'playing' || phase === 'reveal') && question) {
    inner = (
      <>
        <div className="text-center text-sm text-gray-400 uppercase tracking-widest no-select">Round {roundNum} · Question {qInRound} of {ROUND_SIZE}</div>
        {phase === 'playing' && timeLeft != null && (
          <div className="text-center"><div className="text-6xl font-black text-[var(--gold)] no-select">{timeLeft}</div><div className="text-xs text-gray-400 no-select">seconds left</div></div>
        )}
        {phase === 'reveal' && autoPlay && (
          <div className="text-center text-sm text-[var(--gold)] font-bold no-select">Auto-advancing…</div>
        )}
        <div className="bg-black/40 rounded-2xl p-5 space-y-3">
          <div className="text-lg text-white no-select">{question.question}</div>
          <div className="grid gap-2">
            {question.options.map((o, i) => (
              <div key={i} className={`rounded-xl px-4 py-2 text-sm border no-select ${o === question.answer ? 'bg-green-900/40 border-green-500 text-green-200 font-bold' : 'bg-gray-800/60 border-gray-700 text-gray-300'}`}>{o}{o === question.answer ? '  ✓' : ''}</div>
            ))}
          </div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <button disabled={busy || phase === 'reveal'} onClick={reveal} className="bg-[var(--mag)] py-4 rounded-xl font-black disabled:opacity-40 no-select">Reveal answer</button>
          <button disabled={busy} onClick={nextQ} className="bg-gradient-to-r from-[var(--gold)] to-orange-500 text-black py-4 rounded-xl font-black no-select">Next →</button>
        </div>
        <button disabled={busy} onClick={() => patch({ phase:'idle' })} className="w-full bg-gray-800 py-2 rounded-xl text-sm text-gray-300 no-select">End event</button>
      </>
    );
  } else if (phase === 'roundbreak') {
    inner = (
      <>
        <div className="bg-black/40 rounded-2xl p-6 text-center space-y-2"><div className="font-display text-3xl text-white no-select">Round {roundNum - 1} complete</div><div className="text-gray-300 no-select">Standings are on the TV.</div></div>
        {players.slice(0, 5).length > 0 && (
          <div className="bg-black/30 rounded-2xl p-4 space-y-1">
            {players.slice(0, 5).map((p, i) => (
              <div key={p.player_id} className="flex justify-between text-sm"><span className="no-select">{i + 1}. {p.name}</span><span className="font-bold no-select">{(p.total_points || 0).toLocaleString()}</span></div>
            ))}
          </div>
        )}
        <button disabled={busy} onClick={startNextRound} className="w-full bg-gradient-to-r from-[var(--gold)] to-orange-500 text-black font-black text-xl py-4 rounded-full no-select">Start Round {roundNum}</button>
        <button disabled={busy} onClick={() => patch({ phase:'idle' })} className="w-full bg-gray-800 py-2 rounded-xl text-sm text-gray-300 no-select">End event</button>
      </>
    );
  } else if (phase === 'finished') {
    inner = (
      <>
        <div className="bg-black/40 rounded-2xl p-6 text-center space-y-2"><div className="font-display text-4xl text-white no-select">Event complete!</div><div className="text-gray-300 no-select">Final standings are on the TV.</div></div>
        {players.slice(0, 5).length > 0 && (
          <div className="bg-black/30 rounded-2xl p-4 space-y-1">
            {players.slice(0, 5).map((p, i) => (
              <div key={p.player_id} className="flex justify-between text-sm"><span className="no-select">{i + 1}. {p.name}</span><span className="font-bold no-select">{(p.total_points || 0).toLocaleString()}</span></div>
            ))}
          </div>
        )}
        <button disabled={busy} onClick={() => patch({ phase:'idle', round:0, q_index:0 })} className="w-full bg-gray-800 py-3 rounded-xl font-bold no-select">Back to start</button>
      </>
    );
  } else {
    inner = (
      <>
        <div className="text-center text-sm text-gray-400 uppercase tracking-widest no-select">Host control · lobby</div>
        <div className="bg-black/40 rounded-2xl p-5 text-center"><div className="text-5xl font-black text-white no-select">{players.length}</div><div className="text-gray-300 no-select">players joined</div></div>
        {players.length > 0 && (
          <div className="bg-black/30 rounded-2xl p-4 flex flex-wrap gap-2 justify-center max-h-44 overflow-y-auto">
            {players.map(p => (<span key={p.player_id} className="text-xs bg-gray-800 border border-gray-700 rounded-full px-3 py-1 no-select">{p.name}</span>))}
          </div>
        )}
        <button disabled={busy} onClick={startEvent} className="w-full bg-gradient-to-r from-[var(--gold)] to-orange-500 text-black font-black text-xl py-4 rounded-full no-select">Start Round 1</button>
        <div className="grid grid-cols-2 gap-3">
          <button disabled={busy} onClick={() => patch({ phase:'lobby', round:0, q_index:0, lobby_id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) })} className="bg-blue-700 py-3 rounded-xl font-bold no-select">Open Lobby</button>
          <button disabled={busy} onClick={() => patch({ phase:'idle', round:0, q_index:0 })} className="bg-gray-800 py-3 rounded-xl font-bold no-select">End Event</button>
        </div>
        <div className="text-center text-xs text-gray-500 no-select">Start Round 1 builds the 3-round playlist and launches the game.</div>
      </>
    );
  }
  return (
    <div className="min-h-screen bg-gradient-to-br from-[#0a0b16] via-[#15103a] to-black p-4 text-white">
      <div className="max-w-lg mx-auto py-4 space-y-4">
        <div className="flex items-center justify-between">
          <BrandMark size="h-8" />
          <span className="text-xs px-3 py-1 rounded-full bg-black/40 border border-gray-700 text-gray-300 no-select">Phase: {phase}</span>
        </div>
        <button onClick={() => setAutoPlay(a => !a)} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl border no-select ${autoPlay ? 'bg-green-900/30 border-green-600' : 'bg-black/30 border-gray-700'}`}>
          <span className="text-sm font-bold">{autoPlay ? '🟢 Auto-play ON' : '⚪ Auto-play OFF'}</span>
          <span className="text-xs text-gray-400">reveals + advances questions for you</span>
        </button>
        {inner}
      </div>
    </div>
  );
}

function StandingsList({ top }) {
  if (!top.length) return <div className="text-gray-400 text-2xl no-select">Waiting for scores…</div>;
  return (
    <div className="w-full max-w-2xl mx-auto space-y-2">
      {top.map((p, i) => (
        <div key={p.player_id} className={`flex items-center justify-between rounded-xl px-6 py-3 ${i === 0 ? 'bg-[var(--gold)] text-black' : i === 1 ? 'bg-white/20 text-white' : i === 2 ? 'bg-orange-900/40 text-white' : 'bg-black/40 text-white'}`}>
          <div className="flex items-center gap-5 min-w-0">
            <span className="font-black text-3xl w-10 text-right no-select">{i + 1}</span>
            <span className="font-bold text-2xl truncate no-select">{p.name}</span>
          </div>
          <span className="font-black text-3xl no-select">{(p.total_points || 0).toLocaleString()}</span>
        </div>
      ))}
    </div>
  );
}

function TvView() {
  const [gs, setGs] = useState(null);
  const [players, setPlayers] = useState([]);
  const [nowTick, setNowTick] = useState(Date.now());
  useEffect(() => {
    const load = async () => { setGs(await gsRead()); setPlayers(await getEventPlayers()); };
    load(); const id = setInterval(load, 1500); return () => clearInterval(id);
  }, []);
  useEffect(() => { const id = setInterval(() => setNowTick(Date.now()), 250); return () => clearInterval(id); }, []);
  const phase = gs?.phase;
  const count = players.length;
  const top = players.slice(0, 10);
  const shell = (inner) => (
    <div className="min-h-screen bg-gradient-to-br from-[#0a0b16] via-[#15103a] to-black flex items-center justify-center p-8 text-white">
      <div className="text-center space-y-6 w-full">{inner}</div>
    </div>
  );
  if (!phase || phase === 'lobby' || phase === 'idle') {
    return shell(<>
      <BrandMark size="h-12" />
      <div className="text-2xl text-gray-300 no-select">Join the game at</div>
      <div className="text-5xl font-black text-[var(--gold)] no-select">backspintrivia.com</div>
      <div className="text-3xl text-[var(--ice)] font-bold no-select">{count} players in</div>
      <div className="text-gray-400 no-select">Grab your phone — we start soon</div>
    </>);
  }
  const roundNum = Math.floor((gs?.q_index ?? 0) / ROUND_SIZE) + 1;
  const qInRound = ((gs?.q_index ?? 0) % ROUND_SIZE) + 1;
  if (phase === 'roundbreak') {
    return shell(<>
      <BrandMark size="h-10" />
      <div className="font-display text-5xl text-white no-select">Round {roundNum - 1} Standings</div>
      <StandingsList top={top} />
      <div className="text-xl text-gray-400 no-select">Round {roundNum} up next</div>
    </>);
  }
  if (phase === 'finished') {
    const champ = top[0];
    return shell(<>
      <BrandMark size="h-10" />
      <div className="text-2xl uppercase tracking-[0.3em] text-[var(--mag)] font-bold no-select">🏆 Champion</div>
      <div className="font-display text-7xl text-[var(--gold)] no-select">{champ ? champ.name : '—'}</div>
      <div className="text-3xl text-white no-select">{champ ? (champ.total_points || 0).toLocaleString() + ' pts' : ''}</div>
      <div className="pt-4"><StandingsList top={top} /></div>
    </>);
  }
  const playlist = gs?.playlist || [];
  const qIndex = gs?.q_index ?? 0;
  const question = (playlist.length && qIndex < playlist.length) ? triviaQuestions.find(q => q.id === playlist[qIndex]) : null;
  if (phase === 'reveal' && question) {
    return shell(<>
      <div className="text-lg uppercase tracking-[0.3em] text-[var(--mag)] font-bold no-select">Round {roundNum} · Question {qInRound} / {ROUND_SIZE}</div>
      <div className="text-3xl text-white max-w-4xl mx-auto no-select">{question.question}</div>
      <div className="max-w-2xl mx-auto bg-green-900/40 border-2 border-green-500 rounded-2xl py-6 px-8">
        <div className="text-sm uppercase tracking-widest text-green-300 no-select">Correct Answer</div>
        <div className="text-5xl font-black text-green-200 no-select">{question.answer}</div>
      </div>
    </>);
  }
  const startedAt = gs?.question_started_at ? new Date(gs.question_started_at).getTime() : null;
  const timeLeft = (phase === 'playing' && startedAt) ? Math.max(0, Math.ceil(HOST_TIME - (nowTick - startedAt) / 1000)) : null;
  return shell(<>
    <BrandMark size="h-12" />
    <div className="text-xl uppercase tracking-[0.3em] text-[var(--mag)] font-bold no-select">Round {roundNum} · Question {qInRound} / {ROUND_SIZE}</div>
    {timeLeft != null ? (
      <div className="font-black text-[var(--gold)] no-select" style={{fontSize:'9rem', lineHeight:1}}>{timeLeft}</div>
    ) : (
      <div className="text-6xl font-black text-[var(--ice)] no-select">Answer revealed</div>
    )}
    <div className="text-gray-400 no-select">{count} players · standings between rounds</div>
  </>);
}

function EventPlayer() {
  const [gs, setGs] = useState(null);
  const [name, setName] = useState('');
  const [joined, setJoined] = useState(false);
  const [count, setCount] = useState(0);
  const [answers, setAnswers] = useState({});
  const [nowTick, setNowTick] = useState(Date.now());
  useEffect(() => {
    let alive = true;
    const load = async () => { const s = await gsRead(); if(!alive) return; setGs(s); const p = await getEventPlayers(); if(!alive) return; setCount(p.length); };
    load(); const id = setInterval(load, 1500); return () => { alive = false; clearInterval(id); };
  }, []);
  useEffect(() => { const id = setInterval(() => setNowTick(Date.now()), 250); return () => clearInterval(id); }, []);
  useEffect(() => {
    try {
      if (localStorage.getItem('bs_event_joined')) { setJoined(true); setName(localStorage.getItem('bs_event_name') || ''); }
      const a = localStorage.getItem('bs_event_answers'); if (a) setAnswers(JSON.parse(a));
    } catch(e){}
  }, []);
  // If the host has opened a NEW lobby session since this device last joined, force a fresh join
  // instead of silently reusing a stale name/identity from a previous event.
  useEffect(() => {
    if (!gs) return;
    const currentLobbyId = gs.lobby_id || '';
    try {
      const seen = localStorage.getItem('bs_event_lobby_id');
      if (seen !== currentLobbyId) {
        localStorage.setItem('bs_event_lobby_id', currentLobbyId);
        localStorage.removeItem('bs_event_joined');
        localStorage.removeItem('bs_event_name');
        setJoined(false);
        setName('');
      }
    } catch(e){}
  }, [gs && gs.lobby_id]);
  const phase = gs?.phase;
  const qIndex = gs?.q_index ?? 0;
  const playlist = gs?.playlist || [];
  const question = (playlist.length && qIndex < playlist.length) ? triviaQuestions.find(q => q.id === playlist[qIndex]) : null;
  const shuffledOpts = useMemo(() => question ? [...question.options].sort(() => Math.random() - 0.5) : [], [qIndex, question ? question.id : 0]);
  const startedAt = gs?.question_started_at ? new Date(gs.question_started_at).getTime() : null;
  const timeLeft = startedAt ? Math.max(0, Math.ceil(HOST_TIME - (nowTick - startedAt) / 1000)) : 0;
  const myAns = answers[qIndex];
  const totalPts = Object.values(answers).reduce((s, a) => s + (a.points || 0), 0);
  const priorPts = Object.entries(answers).reduce((s, [k, a]) => (Number(k) !== qIndex ? s + (a.points || 0) : s), 0);
  const displayPts = phase === 'playing' ? priorPts : totalPts;
  useEffect(() => {
    if (!playlist.length) return;
    const sig = playlist.slice(0, 5).join('-') + ':' + playlist.length;
    try {
      if (localStorage.getItem('bs_event_sig') !== sig) {
        localStorage.setItem('bs_event_sig', sig);
        localStorage.setItem('bs_event_answers', '{}');
        setAnswers({});
      }
    } catch(e){}
  }, [playlist.length, playlist[0]]);

  useEffect(() => {
    if (!joined) return;
    if (phase === 'roundbreak' || phase === 'finished') {
      const vals = Object.values(answers);
      bankEventScore({
        name: (typeof localStorage !== 'undefined' && localStorage.getItem('bs_event_name')) || name || 'Player',
        total_points: vals.reduce((s, a) => s + (a.points || 0), 0),
        correct_count: vals.filter(a => a.correct).length,
        total_questions: vals.length
      });
    }
  }, [phase, joined]);

  const doJoin = async () => {
    if (!name.trim()) return;
    await joinEvent(name.trim());
    try { localStorage.setItem('bs_event_joined', '1'); localStorage.setItem('bs_event_name', name.trim()); } catch(e){}
    setJoined(true);
  };
  const pick = (opt) => {
    if (phase !== 'playing' || timeLeft <= 0 || !question) return;
    if (answers[qIndex] && answers[qIndex].choice === opt) return;
    const correct = opt === question.answer;
    const pts = correct ? bucketPoints(timeLeft) : 0;
    const next = { ...answers, [qIndex]: { choice: opt, points: pts, correct } };
    setAnswers(next);
    try { localStorage.setItem('bs_event_answers', JSON.stringify(next)); } catch(e){}
  };
  const wrap = (inner) => (
    <div className="min-h-screen bg-gradient-to-br from-[#0a0b16] via-[#15103a] to-black flex items-center justify-center p-4 text-white">
      <div className="max-w-sm w-full text-center space-y-5">{inner}</div>
    </div>
  );

  if (!gs) return wrap(<><BrandMark size="h-10" /><div className="text-gray-300 no-select">Connecting…</div></>);

  if ((phase === 'playing' || phase === 'reveal') && question) {
    const showAnswer = phase === 'reveal';
    const roundNum = Math.floor(qIndex / ROUND_SIZE) + 1;
    const qInRound = (qIndex % ROUND_SIZE) + 1;
    return (
      <div className="min-h-screen bg-gradient-to-br from-[#0a0b16] via-[#15103a] to-black p-4 text-white flex flex-col">
        <div className="max-w-md mx-auto w-full flex-1 flex flex-col py-3">
          <div className="flex items-center justify-between mb-3">
            <div className="text-xs text-[var(--mag)] font-bold uppercase tracking-widest no-select">Round {roundNum} · Q {qInRound}/{ROUND_SIZE}</div>
            <div className="text-sm font-bold no-select">{displayPts.toLocaleString()} pts</div>
          </div>
          {!showAnswer && (
            <div className="mb-3">
              <div className="h-2 bg-gray-800 rounded-full overflow-hidden"><div className="h-full bg-[var(--gold)] transition-all" style={{width: `${(timeLeft/HOST_TIME)*100}%`}}></div></div>
              <div className="text-center text-xs text-gray-400 mt-1 no-select">{timeLeft}s</div>
            </div>
          )}
          <div className="bg-black/40 rounded-2xl p-5 mb-4"><div className="text-lg text-white no-select">{question.question}</div></div>
          <div className="grid gap-3 flex-1 content-start">
            {shuffledOpts.map((o, i) => {
              let cls = 'bg-gray-800/70 border-gray-700 text-white';
              if (showAnswer) {
                if (o === question.answer) cls = 'bg-green-900/50 border-green-500 text-green-100';
                else if (myAns && myAns.choice === o) cls = 'bg-red-900/40 border-red-500 text-red-200';
                else cls = 'bg-gray-800/40 border-gray-700 text-gray-400';
              } else if (myAns && myAns.choice === o) {
                cls = 'bg-[var(--gold)] border-[var(--gold)] text-black';
              }
              return (
                <button key={i} disabled={showAnswer || timeLeft <= 0} onClick={() => pick(o)}
                  className={`w-full text-left px-4 py-3 rounded-xl border font-semibold ${cls} no-select`}>{o}</button>
              );
            })}
          </div>
          <div className="text-center mt-4 min-h-[2rem]">
            {showAnswer ? (
              <div className={`font-bold no-select ${myAns && myAns.correct ? 'text-green-400' : 'text-gray-300'}`}>{myAns ? (myAns.correct ? `Correct! +${myAns.points} pts` : (myAns.choice ? 'Not quite' : 'No answer')) : 'No answer'}</div>
            ) : timeLeft <= 0 ? (
              myAns ? <div className="text-[var(--gold)] font-bold no-select">Locked in ✓</div> : <div className="text-gray-400 no-select">Time's up</div>
            ) : myAns ? (
              <div className="text-[var(--gold)] font-bold no-select">Selected ✓ — tap another to change</div>
            ) : (
              <div className="text-gray-500 text-sm no-select">Tap your answer</div>
            )}
          </div>
        </div>
      </div>
    );
  }

  if (phase === 'playing' || phase === 'reveal') {
    return wrap(<><BrandMark size="h-10" /><div className="text-gray-300 no-select">Loading question…</div></>);
  }

  if (phase === 'roundbreak') {
    const roundDone = Math.floor(qIndex / ROUND_SIZE);
    return wrap(<>
      <BrandMark size="h-10" />
      <div className="font-display text-4xl text-white no-select">Round {roundDone} done!</div>
      <div className="bg-black/30 rounded-2xl p-5"><div className="text-gray-300 no-select">Your score</div><div className="text-4xl font-black text-[var(--gold)] no-select">{totalPts.toLocaleString()}</div></div>
      <div className="text-[var(--ice)] no-select">Standings are on the screen — next round coming up.</div>
    </>);
  }
  if (phase === 'finished') {
    return wrap(<>
      <BrandMark size="h-10" />
      <div className="font-display text-4xl text-white no-select">That's a wrap!</div>
      <div className="bg-black/30 rounded-2xl p-5"><div className="text-gray-300 no-select">Your final score</div><div className="text-5xl font-black text-[var(--gold)] no-select">{totalPts.toLocaleString()}</div></div>
      <div className="text-gray-300 no-select">Thanks for playing! Final standings are on the screen.</div>
    </>);
  }

  if (!joined) {
    return wrap(<>
      <BrandMark size="h-10" />
      <div className="font-display text-3xl text-white no-select">2006 Reunion Trivia</div>
      <div className="text-gray-300 no-select">Enter your name to join</div>
      <input value={name} onChange={e => setName(e.target.value)} maxLength={40} placeholder="Your name"
        onKeyDown={e => e.key === 'Enter' && doJoin()}
        className="w-full px-4 py-3 rounded-xl bg-gray-900 text-white border border-gray-700 focus:outline-none text-center" />
      <button onClick={doJoin} disabled={!name.trim()} className="w-full bg-gradient-to-r from-[var(--gold)] to-orange-500 text-black font-black text-lg py-3 rounded-full disabled:opacity-40 no-select">Join</button>
      <div className="text-gray-400 text-sm no-select">{count} players here</div>
    </>);
  }
  return wrap(<>
    <BrandMark size="h-10" />
    <div className="w-16 h-16 mx-auto rounded-full bg-green-900/40 border border-green-600 flex items-center justify-center text-3xl no-select">✓</div>
    <div className="text-2xl font-bold text-white no-select">You're in, {name}!</div>
    <div className="text-gray-300 no-select">Sit tight — the game starts soon.</div>
    <div className="text-gray-400 text-sm no-select border-t border-gray-800 pt-4">{count} players here</div>
    <div className="text-gray-500 text-xs no-select">DJ C-Blak warming up</div>
  </>);
}

function LockedScreen() {
  return (
    <div className="min-h-screen bg-gradient-to-br from-[#0a0b16] via-[#15103a] to-black flex items-center justify-center p-4 text-white">
      <div className="max-w-sm w-full text-center space-y-5">
        <BrandMark size="h-10" />
        <div className="text-5xl no-select">🔒</div>
        <div className="font-display text-3xl text-white no-select">Doors aren't open yet</div>
        <div className="text-gray-300 no-select">Trivia night starts soon — check back right before showtime, or ask DJ C-Blak.</div>
      </div>
    </div>
  );
}

function PlayerRoot() {
  const [phase, setPhase] = useState(undefined);
  useEffect(() => {
    let alive = true;
    const load = async () => { const gs = await gsRead(); if (alive) setPhase(gs?.phase || 'idle'); };
    load(); const id = setInterval(load, 3000); return () => { alive = false; clearInterval(id); };
  }, []);
  if (phase === undefined) {
    return <div className="min-h-screen bg-gradient-to-br from-[#0a0b16] via-[#15103a] to-black flex items-center justify-center text-white"><div className="text-3xl spinner">🎧</div></div>;
  }
  const eventActive = ['lobby', 'playing', 'roundbreak', 'reveal', 'finished'].includes(phase);
  if (eventActive) return <EventPlayer />;
  return <LockedScreen />;
}

function PracticeGate() {
  const [phase, setPhase] = useState(undefined);
  useEffect(() => {
    let alive = true;
    const load = async () => { const gs = await gsRead(); if (alive) setPhase(gs?.phase || 'idle'); };
    load(); const id = setInterval(load, 3000); return () => { alive = false; clearInterval(id); };
  }, []);
  if (phase === undefined) {
    return <div className="min-h-screen bg-gradient-to-br from-[#0a0b16] via-[#15103a] to-black flex items-center justify-center text-white"><div className="text-3xl spinner">🎧</div></div>;
  }
  if (phase === 'idle') return <LockedScreen />;
  return <MusicTrivia />;
}

function Root() {
  const path = window.location.pathname.replace(/\/+$/, '');
  if (path === '/host') return <HostView />;
  if (path === '/tv') return <TvView />;
  if (path === '/practice') return <PracticeGate />;
  return <PlayerRoot />;
}
ReactDOM.render(<Root />, document.getElementById('root'));
</script>
</body>
</html>
